# =====================================================================================================
# TERRAN VARIANT of ablation_arm_5a for SMACv2 10gen_terran (map_type == "terran_gen"), 3 seeds, GPU jobs
# (cc_smacv2_ablation_terran.sh -> cc_smacv2_gpu.sh).  Run as:  --config=terran_ablations/ablation_arm_5a
# Copied from ablation_arm_5a.yaml on 2026-08-26; the original header below describes the arm itself.
# Changes vs the source: `agent: hpn_saleq` -> `agent: hpn_saleq_terran` (healer-aware head, required on terran_gen) and name.
#   The learner / norm / WM settings of the arm are unchanged.
# name: "ablation_arm_5a_terran" (tb/sacred/model dirs are self-identifying; the map is also in unique_token).
# =====================================================================================================
# =====================================================================================================
# ABLATION ARM 5a (plan id 5a) -- "mixer sees the imagined trajectory only (no raw global state)".
#
# Component ablated : the raw global state s_t as input to the QMIX mixing network. In the full method the
#                     mixer hypernetworks read aug_state = [s_t ; traj_t]; here they read traj_t ONLY
#                     (the 32-d aggregated k-step imagination from the SEM world model). The world model
#                     itself still encodes the FULL s_t; the agent, head, WM losses and TD(lambda) are unchanged.
# Single-variable diff vs hpn_saleq_sem_wm_qmix.yaml : `learner: saleq_wm_learner` ->
#                     `learner: ablation_mixstate_learner` + new key `mixer_state: "traj"`; `name`.
# Deploys           : agent = hpn_saleq, mac = hpn_mac,
#                     learner = ablation_mixstate_learner (src/learners/ablation_mixstate_learner.py, copy of
#                     saleq_wm_learner.py; mixers built with input dim wm_traj_dim = 32).
# Hypothesis        : the WM's imagined-trajectory summary is (or is not) a sufficient mixing context on its
#                     own; expected worse than the full method since the current-state information reaches
#                     the mixer only through the 32-d latent summary.
# Race scope        : protoss + zerg ONLY. On 10gen_terran hpn_saleq fails loudly at the terran_gen assert
#                     (a terran twin would only need `agent: hpn_saleq_terran`; not created for this study).
# =====================================================================================================
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000

runner: "parallel"
batch_size_run: 8
buffer_size: 5000
batch_size: 128
t_max: 1050000            # validation budget; reference reaches ~1.0 win by ~430k

target_update_interval: 200

mac: "hpn_mac"
agent: "hpn_saleq_terran"
agent_output_type: q
hpn_hyper_dim: 64
hpn_hyper_activation: "relu"
hpn_head_num: 1
saleq_emb_dim: 32
saleq_zsa_dim: 64
saleq_hidden_dim: 64
saleq_norm: "sem"        # SEM base (adopted after G3.1)
saleq_sem_groups: 8

learner: "ablation_mixstate_learner"   # <-- ABLATION: copy of saleq_wm_learner with the mixer input ablated
mixer_state: "traj"                    # <-- ABLATION: mixer reads traj_t only (raw s_t dropped)
# world-model block (phase2-plan_v2 W9/W10/W13) -- unchanged
wm_groups: 8             # L_w categorical groups
wm_vertices: 8           # V vertices per group -> d_wm = 64
wm_state_dim: 64         # d_s (z^s, 8-group SEM_det)
wm_sa_dim: 64            # d_sa (phi^{sa})
wm_traj_dim: 32          # aggregated imagination -> the mixer's ONLY input in this arm
wm_k: 5                  # imagination depth (the method's value)
wm_k_train: 1            # one-step prior training (W13)
wm_alpha: 0.8            # KL balance (prior-training weight)
wm_unimix: 0.01          # unimix ratio
c_wm: 1.0               # world-model objective weight
c_kl: 1.0
c_rec: 1.0
c_pred: 1.0
c_act: 1.0

mixer: "qmix"            # nmix.Mixer(args) -> abs=True; the ablation learner rebuilds it with input dim 32
mixing_embed_dim: 32
hypernet_embed: 64

lr: 0.001
optimizer: "adam"
td_lambda: 0.6
q_lambda: False

obs_agent_id: True
obs_last_action: False

name: "ablation_arm_5a_terran"
